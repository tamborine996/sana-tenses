<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A calm five-minute English reading and conversation routine.">
  <meta name="theme-color" content="#f4efe4">
  <title>English Reading Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="English Reading Practice home">
      <span class="brand-mark" aria-hidden="true">R</span>
      <span>
        <strong>English Reading Practice</strong>
        <small>A short read. A real conversation.</small>
      </span>
    </a>
  </header>

  <main id="app" class="reader-shell">
    <div class="loading-card" role="status" aria-live="polite">
      <p class="eyebrow">Today’s reading</p>
      <h1>Opening the article…</h1>
    </div>
  </main>

  <footer class="site-footer">
    <p>Made for calm, tutor-led speaking practice.</p>
  </footer>

  <noscript>
    <p class="noscript-message">Please enable JavaScript to open today’s reading.</p>
  </noscript>
</body>
</html>
